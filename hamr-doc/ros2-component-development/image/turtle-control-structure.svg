<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <!-- ============ runtime domains ============ -->
  <rect x="20"  y="70"  width="180" height="250" fill="#ded6ef" stroke="#8f7fb8"/>
  <text x="110" y="92"  text-anchor="middle" font-size="13" font-weight="bold">micro-ROS</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#555">(MCU firmware)</text>

  <rect x="222" y="40"  width="90" height="310" fill="#fadadd" stroke="#d99"/>
  <text x="267" y="62"  text-anchor="middle" font-size="12" font-weight="bold">Micro</text>
  <text x="267" y="78"  text-anchor="middle" font-size="12" font-weight="bold">XRCE-DDS</text>

  <rect x="334" y="70"  width="130" height="250" fill="#d6e4f7" stroke="#7fa3cc"/>
  <text x="399" y="92"  text-anchor="middle" font-size="12" font-weight="bold">micro-ROS</text>
  <text x="399" y="108" text-anchor="middle" font-size="12" font-weight="bold">Agent</text>

  <rect x="486" y="40"  width="90" height="310" fill="#fadadd" stroke="#d99"/>
  <text x="531" y="62"  text-anchor="middle" font-size="12" font-weight="bold">Fast</text>
  <text x="531" y="78"  text-anchor="middle" font-size="12" font-weight="bold">DDS</text>

  <rect x="598" y="70"  width="330" height="250" fill="#d8ecd9" stroke="#8ab98c"/>
  <text x="763" y="92"  text-anchor="middle" font-size="13" font-weight="bold">ROS 2</text>
  <text x="763" y="108" text-anchor="middle" font-size="10" fill="#555">(host)</text>

  <!-- ============ nodes ============ -->
  <circle cx="110" cy="215" r="42" fill="#fde7c3" stroke="#c9973c"/>
  <text x="110" y="212" text-anchor="middle" font-size="13" font-weight="bold">encoder</text>
  <text x="110" y="227" text-anchor="middle" font-size="9" fill="#555">periodic 100ms</text>

  <circle cx="683" cy="200" r="42" fill="#fde7c3" stroke="#c9973c"/>
  <text x="683" y="197" text-anchor="middle" font-size="13" font-weight="bold">pilot</text>
  <text x="683" y="212" text-anchor="middle" font-size="9" fill="#555">sporadic</text>

  <!-- turtlesim: off-model in this variant, hence dashed -->
  <circle cx="853" cy="200" r="42" fill="#f2f2f2" stroke="#999" stroke-dasharray="5 3"/>
  <text x="853" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">turtlesim</text>
  <text x="853" y="212" text-anchor="middle" font-size="9" fill="#777">off-model</text>

  <!-- ============ encoder -> pilot ============ -->
  <path d="M152,178 H641" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="172" font-size="11">proc_pilot_speed</text>
  
  <path d="M152,196 H641" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="190" font-size="11">proc_pilot_overspeed</text>
  
  <!-- ============ pilot -> encoder ============ -->
  <path d="M641,224 H152" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="218" font-size="11">proc_encoder_mode</text>
  
  <path d="M641,242 H152" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="237" font-size="11">proc_encoder_trim</text>
  

  <!-- ============ pilot <-> turtlesim, via deployment remaps ============ -->
  <path d="M725,186 H811" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M811,214 H725" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <rect x="633" y="272" width="280" height="38" rx="4" fill="#fff5f5" stroke="#c66" stroke-dasharray="4 3"/>
  <text x="773" y="288" text-anchor="middle" font-size="10" fill="#a33">proc_pilot_cmdVel  →  /turtle1/cmd_vel</text>
  <text x="773" y="302" text-anchor="middle" font-size="10" fill="#a33">proc_pilot_pose  ←  /turtle1/pose</text>
  <path d="M773,254 V272" stroke="#c66" stroke-width="1.2" stroke-dasharray="3 2" fill="none"/>
  <text x="773" y="250" text-anchor="middle" font-size="10" fill="#a33" font-style="italic">bound by deployment remap</text>

  <!-- ============ caption ============ -->
  <text x="20" y="400" font-size="11" fill="#444">
    Topic names are path-derived: nothing in the model names them, so they come from the receiving port's path.
  </text>
  <text x="20" y="418" font-size="11" fill="#444">
    turtlesim's real topics are /turtle1/cmd_vel and /turtle1/pose, so those two edges are reconciled at deployment
  </text>
  <text x="20" y="436" font-size="11" fill="#444">
    time rather than in the model — and nothing checks that binding.
  </text>
</svg>
