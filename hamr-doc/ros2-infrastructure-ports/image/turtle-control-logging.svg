<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- ============ runtime domains ============ -->
  <rect x="20"  y="70"  width="180" height="250" fill="#ded6ef" stroke="#8f7fb8"/>
  <text x="110" y="92"  text-anchor="middle" font-size="13" font-weight="bold">micro-ROS</text>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#555">(MCU firmware)</text>

  <rect x="222" y="40"  width="90" height="310" fill="#fadadd" stroke="#d99"/>
  <text x="267" y="62"  text-anchor="middle" font-size="12" font-weight="bold">Micro</text>
  <text x="267" y="78"  text-anchor="middle" font-size="12" font-weight="bold">XRCE-DDS</text>

  <rect x="334" y="70"  width="130" height="250" fill="#d6e4f7" stroke="#7fa3cc"/>
  <text x="399" y="92"  text-anchor="middle" font-size="12" font-weight="bold">micro-ROS</text>
  <text x="399" y="108" text-anchor="middle" font-size="12" font-weight="bold">Agent</text>

  <rect x="486" y="40"  width="90" height="310" fill="#fadadd" stroke="#d99"/>
  <text x="531" y="62"  text-anchor="middle" font-size="12" font-weight="bold">Fast</text>
  <text x="531" y="78"  text-anchor="middle" font-size="12" font-weight="bold">DDS</text>

  <rect x="598" y="70"  width="330" height="250" fill="#d8ecd9" stroke="#8ab98c"/>
  <text x="763" y="92"  text-anchor="middle" font-size="13" font-weight="bold">ROS 2</text>
  <text x="763" y="108" text-anchor="middle" font-size="10" fill="#555">(host)</text>

  <!-- namespace bands -->
  <rect x="34" y="132" width="152" height="104" rx="6"
        fill="none" stroke="#7a7" stroke-dasharray="6 3"/>
  <text x="110" y="127" text-anchor="middle" font-size="10" fill="#5a7a5a" font-style="italic">namespace /rover</text>

  <rect x="612" y="132" width="132" height="172" rx="6"
        fill="none" stroke="#7a7" stroke-dasharray="6 3"/>
  <text x="678" y="127" text-anchor="middle" font-size="10" fill="#5a7a5a" font-style="italic">namespace /rover</text>

  <!-- ============ nodes ============ -->
  <circle cx="110" cy="184" r="42" fill="#fde7c3" stroke="#c9973c"/>
  <text x="110" y="181" text-anchor="middle" font-size="13" font-weight="bold">encoder</text>
  <text x="110" y="196" text-anchor="middle" font-size="9" fill="#555">periodic 100ms</text>

  <circle cx="678" cy="184" r="42" fill="#fde7c3" stroke="#c9973c"/>
  <text x="678" y="181" text-anchor="middle" font-size="13" font-weight="bold">pilot</text>
  <text x="678" y="196" text-anchor="middle" font-size="9" fill="#555">sporadic</text>

  <circle cx="860" cy="184" r="42" fill="#fde7c3" stroke="#c9973c"/>
  <text x="860" y="178" text-anchor="middle" font-size="12" font-weight="bold">turtlesim</text>
  <text x="860" y="192" text-anchor="middle" font-size="8" fill="#555">platform-</text>
  <text x="860" y="202" text-anchor="middle" font-size="8" fill="#555">provided</text>

  <!-- logger, inside /rover, below pilot -->
  <circle cx="678" cy="266" r="34" fill="#fde7c3" stroke="#c9973c"/>
  <text x="678" y="264" text-anchor="middle" font-size="12" font-weight="bold">logger</text>
  <text x="678" y="278" text-anchor="middle" font-size="9" fill="#555">sporadic</text>

  <!-- ============ encoder -> pilot ============ -->
  <path d="M152,150 H636" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="144" font-size="11">/rover/speed</text>

  <path d="M152,168 H636" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="162" font-size="11">/rover/proc_pilot_overspeed</text>

  <!-- ============ pilot -> encoder ============ -->
  <path d="M636,200 H152" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="194" font-size="11">/rover/proc_encoder_mode</text>

  <path d="M636,218 H152" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="213" font-size="11">/rover/proc_encoder_trim</text>

  <!-- ============ pilot <-> turtlesim ============ -->
  <path d="M720,170 H818" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="769" y="164" text-anchor="middle" font-size="10">/turtle1/cmd_vel</text>

  <path d="M818,204 H720" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="769" y="219" text-anchor="middle" font-size="10">/turtle1/pose</text>

  <!-- ============ the modeled rosout flow: encoder -> logger ============ -->
  <path d="M110,226 V300 H644" stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="340" y="294" font-size="11" font-weight="bold">/rosout</text>
  <text x="404" y="294" font-size="10" fill="#666">— the modeled edge (cLog)</text>

  <!-- ============ unmodeled writers on the same topic ============ -->
  <path d="M678,226 V232" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>
  <path d="M860,226 V300 H712" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#g)"/>
  <text x="800" y="322" text-anchor="middle" font-size="9" fill="#777" font-style="italic">unmodeled writers — rclcpp publishes /rosout by default</text>

  <!-- ============ caption ============ -->
  <text x="20" y="386" font-size="11" fill="#444">
    /rosout is platform-pinned and absolute: unlike /rover/speed it does not compose with the node namespace, so the
  </text>
  <text x="20" y="404" font-size="11" fill="#444">
    logger sits in /rover yet still subscribes to /rosout. The encoder's rosout port generates no publisher — it makes
  </text>
  <text x="20" y="422" font-size="11" fill="#444">
    codegen call rcl_logging_configure and set the firmware's logging flags. pilot and turtlesim write to the same topic
  </text>
  <text x="20" y="440" font-size="11" fill="#444">
    without modeling anything, which is why the solid edge is worth drawing: it records whose flow the model cares about.
  </text>
</svg>
